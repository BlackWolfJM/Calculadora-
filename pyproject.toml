[project]
name = "calculadora"
version = "0.1.0"
description = "Calculadora Súper Inteligente"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pyside6>=6.0.0",
    "sympy>=1.12.0",
    "lark>=1.1.0",
    "numpy>=2.5.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-qt>=4.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
    "pyinstaller>=6.0.0",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.13"
strict = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.pyright]
extraPaths = ["."]
